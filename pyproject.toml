[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "halopy"
version = "0.1.3"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.0",
    "pydantic-settings>=2.14.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
ui = ["nicegui>=2"]

[dependency-groups]
dev = ["bump-my-version>=1.5.1"]

[tool.setuptools.packages.find]
include = ["halopy*"]